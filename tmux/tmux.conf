# tmux — Fedora / Ghostty / Wayland
#
# ─────────────────────────────────────────────────────────────────────
#  NO KEYS ARE REBOUND IN THIS FILE.
#
#  Every shortcut is stock tmux, so anything you read in `man tmux`, a
#  tutorial or a StackOverflow answer applies here verbatim. Prefix is
#  Ctrl+B. Windows and panes are numbered from 0, as tmux ships.
#
#  The one exception is the mouse wheel at the bottom, kept because your
#  scroll speed is tuned across three layers — it is clearly marked and
#  safe to delete if you want absolute zero.
#
#  To see what a key does:   prefix ?          (searchable list)
#  To find one key:          tmux list-keys | grep -w c
# ─────────────────────────────────────────────────────────────────────
#
# Reload after editing:  tmux source ~/.config/tmux/tmux.conf


# ── Terminal correctness ─────────────────────────────────────────────
# These are not preferences — without them Neovim misbehaves inside tmux.
set -g default-terminal "tmux-256color"

# Truecolour + undercurl, or the Gruvbox colourscheme in nvim falls back
# to 256 colours and the palette stops matching the status bar. This is
# also what lets the status bar below run in `dark` (hex) rather than
# `dark256` (approximated) mode.
set -as terminal-features ",xterm-ghostty:RGB:usstyle"

# OSC 52. Lets tmux hand a copy straight to the Wayland clipboard through
# Ghostty, which is why no custom copy binding is needed below.
set -as terminal-overrides ",xterm-ghostty:Ms=\\E]52;%p1%s;%p2%s\\a"
set -g set-clipboard on

# Cursor shape. tmux-256color doesn't advertise Ss/Se, so without this
# tmux swallows nvim's DECSCUSR and the cursor stays a block in insert
# mode. Single-quoted so tmux passes \E through to terminfo untouched.
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# Extended keys (CSI u). Without these, nvim inside tmux cannot tell
# <C-/> from <C-_>, or <C-Enter>/<S-Enter> from plain Enter — plugins
# that bind them silently do nothing.
set -s extended-keys on
set -as terminal-features ",xterm-ghostty:extkeys"

# Lets programs pass escape sequences through tmux untouched (image
# protocols, some nvim plugins).
set -g allow-passthrough on


# ── Neovim comfort ───────────────────────────────────────────────────
# Without this, <Esc> in nvim stalls for about half a second.
set -sg escape-time 0
# Lets nvim see FocusGained/FocusLost, so :autoread works.
set -g focus-events on


# ── General ──────────────────────────────────────────────────────────
set -g history-limit 100000
set -g mouse on
set -g set-titles on
set -g set-titles-string "#S ─ #W"

# vi keys in copy mode, to match Neovim. Selection is stock: Space to
# start selecting, Enter to copy. With set-clipboard on above, the copy
# lands in the system clipboard automatically.
setw -g mode-keys vi


# ── Mouse wheel — the ONLY thing here that touches a binding ──────────
# Delete these two lines for a completely untouched tmux. Everything
# else in this file is a setting, not a key.
#
# One line per wheel event, down from tmux's default 5. Pinned to 1 so
# this layer is the identity: lines-per-detent is then decided entirely
# by Ghostty's mouse-scroll-multiplier, which makes that the one number
# to turn. nvim's `mousescroll` is set to ver:1 to match, so a detent
# moves one line whether the pane holds a shell or an editor.
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down


# ── Appearance: Gruvbox ──────────────────────────────────────────────
# github.com/egel/tmux-gruvbox, cloned to
# ~/.config/tmux/plugins/tmux-gruvbox. Installed by hand rather than
# through TPM: it is one run-shell line and one directory, with no
# plugin manager to keep in sync.
#
# Update it later with:
#   git -C ~/.config/tmux/plugins/tmux-gruvbox pull
#
# The theme owns the bar's appearance, so nothing else here styles it:
# status-style, status-left, status-right and the window-status-* formats
# are all rewritten by the run-shell at the bottom, and setting them
# above it just loses the fight. Shape them through @tmux-gruvbox-*
# options instead. Options it never touches — status-interval below,
# for one — are safe to set here as normal.
#
# Full option list: ~/.config/tmux/plugins/tmux-gruvbox/README.md

# `dark` uses hex colours; `dark256` approximates them into the 256-colour
# cube. The terminal-features RGB line above is what makes `dark` the
# right choice — it keeps these greys byte-identical to the ones Ghostty
# and nvim are using, instead of landing on the nearest cube entry.
set -g @tmux-gruvbox 'dark'

# The bar keeps its own #3c3836 ground rather than going transparent.
# It is a step lighter than the #222226 behind it, so the strip reads as
# a deliberate surface sitting on the terminal; `-statusbar-alpha true`
# would flatten it into the background and take the current-window
# highlight with it, leaving nothing to mark which window you are in.

# Left segment: session name, as it was before.
set -g @tmux-gruvbox-left-status-a '#S'

# Right segments. X and Y are drawn inside one block, and the plugin's
# defaults put a clock and date there — which the desktop's own bar
# already carries two centimetres above the terminal, so the old config
# dropped those widgets and this one does too.
#
# X takes the git branch instead: the one part of the previous theme's
# git widget worth keeping, and this version needs neither bc nor jq to
# draw it. The sed supplies the  glyph only when there is a branch to
# label, so outside a repo the whole thing collapses to blank rather
# than leaving a bare glyph behind.
set -g @tmux-gruvbox-right-status-x "#(cd '#{pane_current_path}' && git rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/^/ /')"

# A single space, not '' — the plugin falls back to its default whenever
# an option reads empty, so blanking Y with '' silently restores the
# clock. A space is the smallest value that counts as set.
set -g @tmux-gruvbox-right-status-y ' '

set -g @tmux-gruvbox-right-status-z '#h'

# How often the branch above is re-read. tmux's default is 15s, which is
# long enough to keep showing the old branch after a checkout.
set -g status-interval 5

# Must come last: this reads every @tmux-gruvbox-* option set above.
run-shell ~/.config/tmux/plugins/tmux-gruvbox/gruvbox-tpm.tmux
