# tmux — Fedora / Ghostty / Wayland
#
# ─────────────────────────────────────────────────────────────────────
#  NO KEYS ARE REBOUND IN THIS FILE.
#
#  Every shortcut is stock tmux, so anything you read in `man tmux`, a
#  tutorial or a StackOverflow answer applies here verbatim. Prefix is
#  Ctrl+B. Windows and panes are numbered from 0, as tmux ships.
#
#  The one exception is the mouse wheel at the bottom, kept because your
#  scroll speed is tuned across three layers — it is clearly marked and
#  safe to delete if you want absolute zero.
#
#  To see what a key does:   prefix ?          (searchable list)
#  To find one key:          tmux list-keys | grep -w c
# ─────────────────────────────────────────────────────────────────────
#
# Reload after editing:  tmux source ~/.config/tmux/tmux.conf


# ── Terminal correctness ─────────────────────────────────────────────
# These are not preferences — without them Neovim misbehaves inside tmux.
set -g default-terminal "tmux-256color"

# Truecolour + undercurl, or the Gruvbox colourscheme in nvim falls back
# to 256 colours and the palette stops matching the status bar. This is
# also what lets the status bar below run in `dark` (hex) rather than
# `dark256` (approximated) mode.
set -as terminal-features ",xterm-ghostty:RGB:usstyle"

# OSC 52. Lets tmux hand a copy straight to the Wayland clipboard through
# Ghostty, which is why no custom copy binding is needed below.
set -as terminal-overrides ",xterm-ghostty:Ms=\\E]52;%p1%s;%p2%s\\a"
set -g set-clipboard on

# Cursor shape. tmux-256color doesn't advertise Ss/Se, so without this
# tmux swallows nvim's DECSCUSR and the cursor stays a block in insert
# mode. Single-quoted so tmux passes \E through to terminfo untouched.
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# Extended keys (CSI u). Without these, nvim inside tmux cannot tell
# <C-/> from <C-_>, or <C-Enter>/<S-Enter> from plain Enter — plugins
# that bind them silently do nothing.
set -s extended-keys on
set -as terminal-features ",xterm-ghostty:extkeys"

# Lets programs pass escape sequences through tmux untouched (image
# protocols, some nvim plugins).
set -g allow-passthrough on


# ── Neovim comfort ───────────────────────────────────────────────────
# Without this, <Esc> in nvim stalls for about half a second.
set -sg escape-time 0
# Lets nvim see FocusGained/FocusLost, so :autoread works.
set -g focus-events on


# ── General ──────────────────────────────────────────────────────────
set -g history-limit 100000
set -g mouse on
set -g set-titles on
set -g set-titles-string "#S ─ #W"

# vi keys in copy mode, to match Neovim. Selection is stock: Space to
# start selecting, Enter to copy. With set-clipboard on above, the copy
# lands in the system clipboard automatically.
setw -g mode-keys vi


# ── Mouse wheel — the ONLY thing here that touches a binding ──────────
# Delete these two lines for a completely untouched tmux. Everything
# else in this file is a setting, not a key.
#
# One line per wheel event, down from tmux's default 5. Pinned to 1 so
# this layer is the identity: lines-per-detent is then decided entirely
# by Ghostty's mouse-scroll-multiplier, which makes that the one number
# to turn. nvim's `mousescroll` is set to ver:1 to match, so a detent
# moves one line whether the pane holds a shell or an editor.
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down


# ── Appearance: Gruvbox, matching nvim's lualine ─────────────────────
# Written out here rather than through egel/tmux-gruvbox, which used to
# draw this bar. Two reasons it had to go:
#
#   1. It hardcodes powerline arrow separators into its status formats,
#      with no option to turn them off. This bar is square — flat blocks
#      of colour, no arrows — to match the nvim statusline above it.
#   2. Its formats are applied by a run-shell, which tmux defers until
#      after this entire file is parsed. Anything set here, above it or
#      below it, loses. Overriding it in place was never an option.
#
# ~/.config/tmux/plugins/tmux-gruvbox is now unused and safe to delete.
#
# The colours below are lualine's gruvbox_dark theme, so the statusline
# and the bar directly beneath it are literally the same palette:
#
#   section a   bg #a89984  fg #282828  bold   session name
#   section b   bg #504945  fg #ebdbb2         inactive windows, host
#   section c   bg #3c3836  fg #a89984         the bar's ground
#   accent      bg #fe8019  fg #282828  bold   current window
#
# Source of truth, if lualine ever changes them:
#   ~/.local/share/nvim/lazy/lualine.nvim/lua/lualine/themes/gruvbox_dark.lua
#
# Hex, not colour names or the 256-cube — the terminal-features RGB line
# near the top is what makes that work, and it keeps these greys
# byte-identical to the ones nvim and Ghostty are already painting.

set -g status on
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 100

# The bar keeps its own #3c3836 ground rather than going transparent.
# It is a step lighter than the #222226 behind it, so the strip reads as
# a deliberate surface sitting on the terminal rather than dissolving
# into it. This is section c, the same ground lualine fills with.
set -g status-style "bg=#3c3836,fg=#a89984"

# Every block below butts straight up against its neighbour: no gap of
# ground between them, exactly as lualine's sections meet. Each block
# carries one space of padding inside its own colour, so what separates
# them is the colour edge itself rather than a gap.
#
# The one place that leaves two blocks the same colour touching is a run
# of inactive windows, which all sit on section b. Their padding spaces
# still hold the labels apart — they read as items on one surface, which
# is what they are.

# Session name — lualine's section a, the block its mode indicator uses,
# in the same corner.
set -g status-left "#[bg=#a89984,fg=#282828,bold] #S "

setw -g window-status-separator ""

# Inactive windows sit on section b, one step up from the ground, so the
# window list reads as tabs rather than as text lying on the bar.
setw -g window-status-format "#[bg=#504945,fg=#a89984] #I #W#{?window_zoomed_flag, Z,} "

# The current window is the one thing on this bar that has to be findable
# at a glance, so it takes the accent — lualine's #fe8019, the colour its
# visual-mode indicator uses. For the old yellow, swap in #fabd2f.
setw -g window-status-current-format "#[bg=#fe8019,fg=#282828,bold] #I #W#{?window_zoomed_flag, Z,} "

# Right: git branch and the clock share one section-b block, with the
# hostname's section-a block flush against it. Both are on the same
# colour, so in a repo they read as one strip — which is how the old
# plugin drew its X and Y widgets too.
#
# %Y-%m-%d and %H:%M are strftime, not shell: tmux runs status-right
# through strftime itself, so these need no #() and cost nothing to draw.
# The formats are the ones the old plugin used for these two widgets.
#
# The branch is the one part that does shell out. Its sed supplies the
# padding spaces only when there is a branch to pad, so outside a repo
# that segment collapses to nothing and the clock simply starts the block
# instead of a bare coloured gap sitting in front of it. Needs neither bc
# nor jq.
set -g status-right "#[bg=#504945,fg=#ebdbb2]#(cd '#{pane_current_path}' && git rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/^/ /;s/$/ /')#[bg=#504945,fg=#ebdbb2] %Y-%m-%d  %H:%M #[bg=#a89984,fg=#282828,bold] #h "

# Drives both the clock above and how often the branch is re-read. tmux's
# default is 15s, which is long enough both to show a stale minute and to
# keep showing the old branch after a checkout.
set -g status-interval 5

# Everything below is what the plugin used to set outside the bar itself.
# Kept at its values so dropping it changed only the things asked for.
setw -g window-status-activity-style "bg=#3c3836,fg=#bdae93"
setw -g window-status-bell-style "bg=#fb4934,fg=#282828"
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#d5c4a1"
set -g message-style "bg=#504945,fg=#ebdbb2"
set -g message-command-style "bg=#bdae93,fg=#3c3836"
set -g display-panes-colour "#3c3836"
set -g display-panes-active-colour "#d5c4a1"
setw -g clock-mode-colour "#83a598"
