# tmux — Fedora / Ghostty / Wayland
#
# ─────────────────────────────────────────────────────────────────────
#  NO KEYS ARE REBOUND IN THIS FILE.
#
#  Every shortcut is stock tmux, so anything you read in `man tmux`, a
#  tutorial or a StackOverflow answer applies here verbatim. Prefix is
#  Ctrl+B. Windows and panes are numbered from 0, as tmux ships.
#
#  The one exception is the mouse wheel at the bottom, kept because your
#  scroll speed is tuned across three layers — it is clearly marked and
#  safe to delete if you want absolute zero.
#
#  To see what a key does:   prefix ?          (searchable list)
#  To find one key:          tmux list-keys | grep -w c
# ─────────────────────────────────────────────────────────────────────
#
# Reload after editing:  tmux source ~/.config/tmux/tmux.conf


# ── Terminal correctness ─────────────────────────────────────────────
# These are not preferences — without them Neovim misbehaves inside tmux.
set -g default-terminal "tmux-256color"

# Truecolour + undercurl, or monokai-pro renders in 256 colours.
set -as terminal-features ",xterm-ghostty:RGB:usstyle"

# OSC 52. Lets tmux hand a copy straight to the Wayland clipboard through
# Ghostty, which is why no custom copy binding is needed below.
set -as terminal-overrides ",xterm-ghostty:Ms=\\E]52;%p1%s;%p2%s\\a"
set -g set-clipboard on

# Cursor shape. tmux-256color doesn't advertise Ss/Se, so without this
# tmux swallows nvim's DECSCUSR and the cursor stays a block in insert
# mode. Single-quoted so tmux passes \E through to terminfo untouched.
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# Extended keys (CSI u). Without these, nvim inside tmux cannot tell
# <C-/> from <C-_>, or <C-Enter>/<S-Enter> from plain Enter — plugins
# that bind them silently do nothing.
set -s extended-keys on
set -as terminal-features ",xterm-ghostty:extkeys"

# Lets programs pass escape sequences through tmux untouched (image
# protocols, some nvim plugins).
set -g allow-passthrough on


# ── Neovim comfort ───────────────────────────────────────────────────
# Without this, <Esc> in nvim stalls for about half a second.
set -sg escape-time 0
# Lets nvim see FocusGained/FocusLost, so :autoread works.
set -g focus-events on


# ── General ──────────────────────────────────────────────────────────
set -g history-limit 100000
set -g mouse on
set -g set-titles on
set -g set-titles-string "#S ─ #W"

# vi keys in copy mode, to match Neovim. Selection is stock: Space to
# start selecting, Enter to copy. With set-clipboard on above, the copy
# lands in the system clipboard automatically.
setw -g mode-keys vi


# ── Mouse wheel — the ONLY thing here that touches a binding ──────────
# Delete these two lines for a completely untouched tmux. Everything
# else in this file is a setting, not a key.
#
# One line per wheel event, down from tmux's default 5. Pinned to 1 so
# this layer is the identity: lines-per-detent is then decided entirely
# by Ghostty's mouse-scroll-multiplier, which makes that the one number
# to turn. nvim's `mousescroll` is set to ver:1 to match, so a detent
# moves one line whether the pane holds a shell or an editor.
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down


# ── Appearance: Dracula ──────────────────────────────────────────────
# github.com/dracula/tmux, cloned to ~/.config/tmux/plugins/dracula.
# Installed by hand rather than through TPM: it is one run-shell line
# and one directory, with no plugin manager to keep in sync.
#
# Update it later with:
#   git -C ~/.config/tmux/plugins/dracula pull
#
# Dracula owns the whole status bar, so nothing else here styles it —
# any status-* line you add above would be silently overwritten by the
# run-shell at the bottom, which is exactly the kind of fight worth
# avoiding. Set its behaviour through @dracula-* options instead.
#
# Full option list: ~/.config/tmux/plugins/dracula/docs/CONFIG.md

# Right-hand widgets. Deliberately just git: GNOME's top bar already
# carries the clock and date, so the default time/date widgets would be
# duplicating what is two centimetres above the terminal.
set -g @dracula-plugins "git"

# Powerline separators need a Nerd Font, which Ghostty is already using.
set -g @dracula-show-powerline true
set -g @dracula-show-left-icon session
set -g @dracula-show-flags true
set -g @dracula-refresh-rate 5
set -g @dracula-border-contrast true

# Must come last: this reads every @dracula-* option set above.
run-shell ~/.config/tmux/plugins/dracula/dracula.tmux
